name: Build

permissions:
  contents: write
  actions: read

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            goarch: arm64
            label: macos
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            goarch: amd64
            label: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: "9"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 libgtk-3-dev

      - run: pnpm install

      - name: Build Tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}

      - name: Collect artifacts
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          ext=""; [ "${{ matrix.label }}" = "windows" ] && ext=".exe"
          arch="${{ matrix.goarch }}"
          label="${{ matrix.label }}"

          # Desktop: bundle
          mkdir -p dist/desktop
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          case "${{ runner.os }}" in
            macOS)
              find "$bundle/dmg" -name "*.dmg" -exec cp {} "dist/desktop/serein-desktop-${V}-${label}-${arch}.dmg" \; ;;
            Windows)
              find "$bundle/nsis" -name "*.exe" -exec cp {} "dist/desktop/serein-desktop-${V}-${label}-${arch}.exe" \; ;;
            Linux)
              find "$bundle/appimage" -name "*.AppImage" -exec cp {} "dist/desktop/serein-desktop-${V}-${label}-${arch}.AppImage" \; ;;
          esac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.label }}-${{ matrix.goarch }}
          path: dist/

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: "9"
      - run: pnpm install && pnpm run build

      - name: Build Server
        run: |
          mkdir -p dist/server
          V="${GITHUB_REF_NAME#v}"
          TARGETS="darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64"
          for t in $TARGETS; do
            goos=${t%/*}; goarch=${t#*/}
            ext=""; [ "$goos" = "windows" ] && ext=".exe"
            label=$(echo "$goos" | sed 's/darwin/macos/;s/linux/linux/;s/windows/windows/')
            name="serein-server-${V}-${label}-${goarch}${ext}"
            out="dist/server/${name}"
            GOOS=$goos GOARCH=$goarch go build -ldflags="-s -w" -o "$out" .
            echo "OK. $name"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server
          path: dist/server/

  release:
    needs: [build, server]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
      - name: Flatten artifacts
        run: |
          mkdir release
          find dist -type f -not -name "*.md" | while read f; do
            cp "$f" "release/$(basename "$f")"
          done
      - name: Extract changelog
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir -p /tmp/release
          sed -n "/^## \[$V\]/,/^## \[/p" CHANGELOG.md | sed '$d' > /tmp/release/body.md
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body_path: /tmp/release/body.md
          files: |
            release/*
          draft: true
