<!doctype html>
<html lang="zh-CN" class="bg-bg">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>规则 | Serein</title>
        <link rel="icon" href="/assets/favicon.svg" />
        <link rel="stylesheet" href="/assets/style.css" />
    </head>
    <body class="text-text font-[system-ui] min-h-screen">
        <div id="topbar"></div>

        <div
            class="max-w-[1200px] mx-auto p-6 flex gap-6 min-h-[calc(100vh-49px)]"
        >
            <aside class="w-[200px] shrink-0 pr-4 border-r border-bord-mid">
                <div
                    class="sticky top-[72px] flex flex-col max-h-[calc(100vh-96px)]"
                >
                    <div
                        class="shrink-0 text-sm text-sub font-semibold pb-2 mb-2 border-b border-bord-mid"
                    >
                        规则源
                    </div>
                    <div class="flex-1 min-h-0 overflow-y-auto scrollbar-hidden">
                        <nav
                            id="source-nav"
                            class="flex flex-col gap-0.5"
                        ></nav>
                    </div>
                </div>
            </aside>

            <main class="flex-1 min-w-0">
                <div
                    id="welcome-view"
                    class="text-sub text-sm max-w-[600px] pt-[25vh] pl-2"
                >
                    <h2 class="text-lg font-semibold text-text mb-3">规则</h2>
                    <p class="mb-2">在左侧选择一个规则源，查看其中的规则。</p>
                    <p class="mb-8">
                        若是你第一次启动，请点击右上角的「拉取规则」来拉取内置的规则表。
                    </p>
                    <h2 class="text-lg font-semibold text-text mb-3">
                        修改 Tracker
                    </h2>
                    <p class="mb-2">
                        每条规则可勾选平台后，点“追踪”来加入默认 Tracker；<br />或点“复制”来复制一段
                        [[tracker]] 片段，自行粘贴到 Tracker 文件。
                    </p>
                    <p>
                        更推荐按 Tracker
                        格式手动编写与管理，这样便于管理，也拥有更高的自定义程度。
                    </p>
                </div>
                <!-- 卡片视图 -->
                <div id="card-view" class="hidden">
                    <div class="flex items-center gap-2 mb-4">
                        <span
                            class="w-[3px] h-[18px] bg-accent rounded-chip"
                        ></span>
                        <span
                            id="source-title"
                            class="font-bold text-sm"
                        ></span>
                        <span class="flex-1"></span>
                        <span
                            id="filter-platforms"
                            class="flex items-center gap-1"
                        ></span>
                    </div>
                    <div id="card-grid" class="grid grid-cols-5 gap-3"></div>
                </div>
            </main>
        </div>

        <script src="/assets/app.min.js"></script>
        <script>
            var currentSource = null;
            var allSourceRules = [];
            var activeFilters = {};

            renderTopbar("规则");
            loadSources();
            api("/api/config").then(function (d) {
                if (d && d.rule_source_dev) {
                    var b = document.getElementById("btn-rule-check-dev");
                    if (b) {
                        b.style.display = "";
                        b.title = d.rule_source_dev;
                    }
                }
            });

            async function loadSources() {
                const sources = (await api("/api/rules")) || [];
                const nav = document.getElementById("source-nav");
                nav.innerHTML = sources
                    .map((s) => {
                        const active =
                            s.source_id === currentSource
                                ? "text-text bg-surface border-l-[2px] border-l-accent"
                                : "text-sub hover:text-text border-l-[2px] border-l-transparent hover:bg-surface hover:border-l-bord";
                        return `<button onclick="selectSource(this.dataset.sourceid)" data-sourceid="${escapeAttr(s.source_id)}" class="text-left flex items-center justify-between gap-2 px-3 py-2 text-sm rounded-r-chip transition-colors ${active}"><span class="flex-1 min-w-0 truncate">${escapeHtml(s.name || s.source_id)}</span><span class="shrink-0 text-xs text-sub">(${escapeHtml(s.app_count)})</span></button>`;
                    })
                    .join("");
            }

            async function selectSource(id) {
                currentSource = id;
                loadSources();
                document.getElementById("source-title").textContent = id;

                var cardView = document.getElementById("card-view");
                var welcomeView = document.getElementById("welcome-view");
                var isNew = cardView.classList.contains("hidden");

                var rules = (await api("/api/rules?source=" + id)) || [];
                allSourceRules = rules;
                activeFilters = {};
                showTrackedOnly = false;
                showUntrackedOnly = false;
                buildPlatformFilters(rules);

                var grid = document.getElementById("card-grid");
                var gridHtml = rules.length
                    ? renderCards(rules)
                    : '<div class="col-span-full">' +
                      emptyState(
                          "暂无规则",
                          "该规则源没有可用规则。",
                          "center"
                      ) +
                      "</div>";
                if (isNew) {
                    grid.innerHTML = gridHtml;
                    swapView(welcomeView, cardView);
                } else {
                    refreshView(grid, function () {
                        grid.innerHTML = gridHtml;
                    });
                }
            }

            var trackedApps = [];
            api("/api/tracker/apps").then(function (data) {
                trackedApps = data || [];
            });

            function buildPlatformFilters(rules) {
                var allPlatforms = [];
                var seen = {};
                for (var i = 0; i < rules.length; i++) {
                    var plats = rules[i].platforms || [];
                    for (var j = 0; j < plats.length; j++) {
                        if (!seen[plats[j]]) {
                            seen[plats[j]] = true;
                            allPlatforms.push(plats[j]);
                        }
                    }
                }
                var el = document.getElementById("filter-platforms");
                var html = '<span class="text-xs text-sub mr-1">筛选</span>';
                html += allPlatforms
                    .map(function (p) {
                        return (
                            '<button data-platform="' +
                            escapeAttr(p) +
                            '" onclick="toggleFilter(this.dataset.platform)" id="btn-filter-' +
                            escapeAttr(p) +
                            '" class="px-2 py-0.5 rounded-chip text-xs border border-bord bg-transparent text-sub hover:text-text cursor-pointer transition-colors">' +
                            escapeHtml(platformLabel(p)) +
                            "</button>"
                        );
                    })
                    .join("");
                html +=
                    '<button onclick="toggleTrackedFilter()" id="btn-tracked-filter" class="px-2 py-0.5 rounded-chip text-xs border border-bord bg-transparent text-sub hover:text-text cursor-pointer transition-colors">已追踪</button>';
                html +=
                    '<button onclick="toggleUntrackedFilter()" id="btn-untracked-filter" class="px-2 py-0.5 rounded-chip text-xs border border-bord bg-transparent text-sub hover:text-text cursor-pointer transition-colors">未追踪</button>';
                el.innerHTML = html;
            }

            var showTrackedOnly = false;
            var showUntrackedOnly = false;
            function toggleTrackedFilter() {
                showTrackedOnly = !showTrackedOnly;
                if (showTrackedOnly) showUntrackedOnly = false;
                updateFilterButtons();
                applyFilter();
            }
            function toggleUntrackedFilter() {
                showUntrackedOnly = !showUntrackedOnly;
                if (showUntrackedOnly) showTrackedOnly = false;
                updateFilterButtons();
                applyFilter();
            }
            function updateFilterButtons() {
                document.getElementById("btn-tracked-filter").className =
                    showTrackedOnly
                        ? "px-2 py-0.5 rounded-chip text-xs border border-accent bg-accent text-white cursor-pointer transition-colors"
                        : "px-2 py-0.5 rounded-chip text-xs border border-bord bg-transparent text-sub hover:text-text cursor-pointer transition-colors";
                document.getElementById("btn-untracked-filter").className =
                    showUntrackedOnly
                        ? "px-2 py-0.5 rounded-chip text-xs border border-accent bg-accent text-white cursor-pointer transition-colors"
                        : "px-2 py-0.5 rounded-chip text-xs border border-bord bg-transparent text-sub hover:text-text cursor-pointer transition-colors";
            }

            function toggleFilter(os) {
                activeFilters[os] = !activeFilters[os];
                var btn = document.getElementById("btn-filter-" + os);
                if (activeFilters[os]) {
                    btn.className =
                        "px-2 py-0.5 rounded-chip text-xs border border-accent bg-accent text-white cursor-pointer transition-colors";
                } else {
                    btn.className =
                        "px-2 py-0.5 rounded-chip text-xs border border-bord bg-transparent text-sub hover:text-text cursor-pointer transition-colors";
                }
                applyFilter();
            }

            function applyFilter() {
                var filtered = allSourceRules;
                if (showTrackedOnly) {
                    filtered = filtered.filter(function (r) {
                        return trackedApps.indexOf(r.app_id) >= 0;
                    });
                }
                if (showUntrackedOnly) {
                    filtered = filtered.filter(function (r) {
                        return trackedApps.indexOf(r.app_id) < 0;
                    });
                }
                var activeCount = 0;
                for (var k in activeFilters) {
                    if (activeFilters[k]) activeCount++;
                }
                if (activeCount > 0) {
                    filtered = filtered.filter(function (r) {
                        return (r.platforms || []).some(function (p) {
                            return activeFilters[p];
                        });
                    });
                }
                var grid = document.getElementById("card-grid");
                grid.innerHTML = renderCards(filtered);
            }

            function renderCards(rules) {
                return rules
                    .map((r) => {
                        const platforms = r.platforms || [];
                        const st = statusInfo(r.status);
                        return `<div data-appid="${escapeAttr(r.app_id)}" class="bg-surface-alt border border-bord-mid rounded-card p-3 flex flex-col card-h hover:border-bord transition-colors">
        <div class="text-sm font-semibold truncate"><span class="select-text${st && st.nameClass ? " " + st.nameClass : ""}" ${tipAttr(escapeHtml(r.app_id || "") + (st ? "<br>状态：" + escapeHtml(st.message) : ""))}>${escapeHtml(r.name || r.app_id)}</span>${st ? " " + st.dotHTML : ""}</div>
        <div class="select-text text-xs text-sub mt-1 truncate">${escapeHtml(r.description || r.app_id)}</div>
        <div class="flex-1 mt-3 flex flex-col gap-1 pl-2">
          ${platforms.map((p) => `<label class="flex items-center gap-2 text-xs text-sub cursor-pointer"><input type="checkbox" class="rule-cb" data-os="${escapeAttr(p)}" onchange="event.stopPropagation()"> ${escapeHtml(platformLabel(p))}</label>`).join("")}
        </div>
        <div class="mt-3 flex gap-2">
          <button onclick="event.stopPropagation(); addToTracker(this.dataset.appid, this)" data-appid="${escapeAttr(r.app_id)}" class="flex-1 text-center text-xs text-sub hover:text-text border border-bord rounded-control py-1 cursor-pointer hover:border-accent transition-colors">追踪</button>
          <button onclick="event.stopPropagation(); copyTrackerSnippet(this.dataset.appid, this)" data-appid="${escapeAttr(r.app_id)}" class="flex-1 text-center text-xs text-sub hover:text-text border border-bord rounded-control py-1 cursor-pointer hover:border-accent transition-colors">复制</button>
        </div>
      </div>`;
                    })
                    .join("");
            }

            async function addToTracker(appId, btn) {
                const cbs = btn
                    .closest(".card-h")
                    .querySelectorAll(".rule-cb:checked");
                const platforms = Array.from(cbs).map((cb) => cb.dataset.os);
                await apiPost("/api/tracker/add", { app_id: appId, platforms });
                btn.textContent = "✓";
                btn.classList.add("text-ok");
            }

            // 按勾选平台复制一段 [[tracker]] 片段，供手动粘贴
            function copyTrackerSnippet(appId, btn) {
                const cbs = btn
                    .closest(".card-h")
                    .querySelectorAll(".rule-cb:checked");
                const platforms = Array.from(cbs).map((cb) => cb.dataset.os);
                let snippet = '[[tracker]]\napp_id = "' + appId + '"';
                if (platforms.length) {
                    snippet +=
                        "\nplatforms = [" +
                        platforms.map((p) => '"' + p + '"').join(", ") +
                        "]";
                }
                snippet += "\n";
                const done = function () {
                    btn.textContent = "已复制";
                    btn.classList.add("text-ok");
                    setTimeout(function () {
                        btn.textContent = "复制";
                        btn.classList.remove("text-ok");
                    }, 1500);
                };
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(snippet).then(done, done);
                } else {
                    done();
                }
            }

            // 支持 /rules?source=<id>&rule=<app_id> 定位（来自全局搜索）
            (async function () {
                var qp = new URLSearchParams(location.search);
                var sid = qp.get("source");
                var rid = qp.get("rule");
                if (!sid) return;
                await selectSource(sid);
                if (!rid) return;
                setTimeout(function () {
                    var el = document.querySelector(
                        '[data-appid="' + CSS.escape(rid) + '"]'
                    );
                    if (!el) return;
                    el.scrollIntoView({ block: "center" });
                    el.classList.add("ring-2", "ring-accent");
                    setTimeout(function () {
                        el.classList.remove("ring-2", "ring-accent");
                    }, 2500);
                }, 200);
            })();
        </script>
    </body>
</html>
