<!doctype html>
<html lang="zh-CN" class="bg-[#1d1d1d]">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>规则 | Serein</title>
<link rel="icon" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body class="text-[rgba(255,255,255,.88)] font-[system-ui] min-h-screen">
<div id="topbar"></div>

<div class="max-w-[1200px] mx-auto p-6 flex gap-6 min-h-[calc(100vh-48px)]">
  <aside class="w-[200px] shrink-0 pr-4 border-r border-[rgba(255,255,255,.08)]">
    <div class="text-sm text-sub font-semibold mb-2">规则源</div>
    <nav id="source-nav" class="flex flex-col gap-0.5"></nav>
  </aside>

  <main class="flex-1 min-w-0">
    <!-- 搜索视图 -->
    <div id="search-view" class="hidden">
      <div class="flex items-center gap-2 mb-4">
        <span class="w-[3px] h-[18px] bg-[#14b8a6] rounded-sm"></span>
        <span class="font-bold text-sm">搜索规则</span>
      </div>
      <div class="relative mb-4">
        <input id="search-input" type="text" placeholder="输入关键词搜索..."
          class="w-full bg-[#202028] border border-[rgba(255,255,255,.12)] rounded-lg px-4 py-2 text-sm outline-none focus:border-[#14b8a6] placeholder:text-sub"
          onkeydown="if(event.key==='Enter') doSearch()">
      </div>
      <div id="search-results-grid" class="grid grid-cols-5 gap-3"></div>
      <div id="search-placeholder" class="text-center py-16 text-sub text-sm">输入关键词搜索规则</div>
    </div>
    <!-- 卡片视图 -->
    <div id="card-view" class="hidden">
      <div class="flex items-center gap-2 mb-4">
        <span class="w-[3px] h-[18px] bg-[#14b8a6] rounded-sm"></span>
        <span id="source-title" class="font-bold text-sm"></span>
        <span class="flex-1"></span>
        <span id="filter-platforms" class="flex items-center gap-1"></span>
      </div>
      <div id="card-grid" class="grid grid-cols-5 gap-3"></div>
    </div>
    <!-- 初始占位 -->
    <div id="placeholder" class="text-sub text-sm max-w-[600px] pt-[25vh] pl-2">
      <h2 class="text-base font-semibold text-white mb-3">规则</h2>
      <p class="mb-2">在左侧栏选择已拉取的规则源来浏览其中的规则。</p>
      <p>若是你第一次启动，请点击右上角的「同步规则」来拉取内置的规则表。</p>
    </div>
  </main>
</div>

<script src="/assets/app.min.js"></script>
<script>
  var currentSource = null;
  var allSourceRules = [];
  var activeFilters = {};

  renderTopbar("规则");
  loadSources();

  document.getElementById("btn-sync").onclick = async () => {
    const ld = showLoading("加载中", "正在同步规则...");
    console.log("[sync]"); const result = await apiPost("/api/rules/sync");
    loadSources();
    if (result && result.Errors && result.Errors.length) {
      var msg = "同步完成，" + (result.Synced || []).length + " 个更新，" + (result.Skipped || []).length + " 个跳过，" + result.Errors.length + " 个失败<br><br>" +
        result.Errors.map(function(e) { return e.url + ": " + e.reason; }).join("<br>");
      ld.done(msg, true);
    } else if (result && result.Synced) {
      var doneMsg = "同步完成（" + result.Synced.length + " 个更新";
      if (result.Skipped && result.Skipped.length) doneMsg += "，" + result.Skipped.length + " 个跳过";
      doneMsg += "）";
      ld.done(doneMsg);
    } else {
      ld.done("同步完成");
    }
  };

  document.getElementById("btn-search-mode").onclick = () => {
    currentSource = null;
    loadSources();
    document.getElementById("placeholder").classList.add("hidden");
    document.getElementById("search-view").classList.remove("hidden");
    document.getElementById("card-view").classList.add("hidden");
    document.getElementById("search-results-grid").innerHTML = "";
    document.getElementById("search-placeholder").classList.remove("hidden");
    document.getElementById("search-input").value = "";
  };

  async function loadSources() {
    const sources = await api("/api/rules/list/all") || [];
    const nav = document.getElementById("source-nav");
    nav.innerHTML = sources.map(s => {
      const active = s.source_id === currentSource ? "text-white bg-[#202028] border-l-[2px] border-l-[#14b8a6]" : "text-sub hover:text-white border-l-[2px] border-l-transparent hover:bg-[#202028] hover:border-l-[rgba(255,255,255,.12)]";
      return `<button onclick="selectSource('${s.source_id}')" class="text-left px-3 py-2 text-sm rounded-r-md transition-colors ${active}">${s.name || s.source_id} <span class="text-sub">(${s.app_count})</span></button>`;
    }).join("");
  }

  async function selectSource(id) {
    currentSource = id;
    loadSources();
    document.getElementById("placeholder").classList.add("hidden");
    document.getElementById("search-view").classList.add("hidden");
    document.getElementById("card-view").classList.remove("hidden");
    document.getElementById("source-title").textContent = id;

    var rules = await api("/api/rules/list/" + id) || [];
    allSourceRules = rules;
    activeFilters = {};
    showTrackedOnly = false;
    showUntrackedOnly = false;
    buildPlatformFilters(rules);
    document.getElementById("card-grid").innerHTML = renderCards(rules);
  }

  var trackedApps = [];
  api("/api/tracker/apps").then(function(data) { trackedApps = data || []; });

  function buildPlatformFilters(rules) {
    var allPlatforms = [];
    var seen = {};
    for (var i = 0; i < rules.length; i++) {
      var plats = rules[i].platforms || [];
      for (var j = 0; j < plats.length; j++) {
        if (!seen[plats[j]]) { seen[plats[j]] = true; allPlatforms.push(plats[j]); }
      }
    }
    var el = document.getElementById("filter-platforms");
    var html = '<span class="text-xs text-sub mr-1">筛选</span>';
    html += allPlatforms.map(function(p) {
      return '<button onclick="toggleFilter(\'' + p + '\')" id="btn-filter-' + p + '" class="px-2 py-0.5 rounded text-xs border border-[rgba(255,255,255,.12)] bg-transparent text-sub hover:text-white cursor-pointer transition-colors">' + platformLabel(p) + '</button>';
    }).join("");
    html += '<button onclick="toggleTrackedFilter()" id="btn-tracked-filter" class="px-2 py-0.5 rounded text-xs border border-[rgba(255,255,255,.12)] bg-transparent text-sub hover:text-white cursor-pointer transition-colors">已追踪</button>';
    html += '<button onclick="toggleUntrackedFilter()" id="btn-untracked-filter" class="px-2 py-0.5 rounded text-xs border border-[rgba(255,255,255,.12)] bg-transparent text-sub hover:text-white cursor-pointer transition-colors">未追踪</button>';
    el.innerHTML = html;
  }

  var showTrackedOnly = false;
  var showUntrackedOnly = false;
  function toggleTrackedFilter() {
    showTrackedOnly = !showTrackedOnly;
    if (showTrackedOnly) showUntrackedOnly = false;
    updateFilterButtons();
    applyFilter();
  }
  function toggleUntrackedFilter() {
    showUntrackedOnly = !showUntrackedOnly;
    if (showUntrackedOnly) showTrackedOnly = false;
    updateFilterButtons();
    applyFilter();
  }
  function updateFilterButtons() {
    document.getElementById("btn-tracked-filter").className = showTrackedOnly
      ? "px-2 py-0.5 rounded text-xs border border-[#14b8a6] bg-[#14b8a6] text-white cursor-pointer transition-colors"
      : "px-2 py-0.5 rounded text-xs border border-[rgba(255,255,255,.12)] bg-transparent text-sub hover:text-white cursor-pointer transition-colors";
    document.getElementById("btn-untracked-filter").className = showUntrackedOnly
      ? "px-2 py-0.5 rounded text-xs border border-[#14b8a6] bg-[#14b8a6] text-white cursor-pointer transition-colors"
      : "px-2 py-0.5 rounded text-xs border border-[rgba(255,255,255,.12)] bg-transparent text-sub hover:text-white cursor-pointer transition-colors";
  }

  function toggleFilter(os) {
    activeFilters[os] = !activeFilters[os];
    var btn = document.getElementById("btn-filter-" + os);
    if (activeFilters[os]) {
      btn.className = "px-2 py-0.5 rounded text-xs border border-[#14b8a6] bg-[#14b8a6] text-white cursor-pointer transition-colors";
    } else {
      btn.className = "px-2 py-0.5 rounded text-xs border border-[rgba(255,255,255,.12)] bg-transparent text-sub hover:text-white cursor-pointer transition-colors";
    }
    applyFilter();
  }

  function applyFilter() {
    var filtered = allSourceRules;
    if (showTrackedOnly) {
      filtered = filtered.filter(function(r) { return trackedApps.indexOf(r.app_id) >= 0; });
    }
    if (showUntrackedOnly) {
      filtered = filtered.filter(function(r) { return trackedApps.indexOf(r.app_id) < 0; });
    }
    var activeCount = 0;
    for (var k in activeFilters) { if (activeFilters[k]) activeCount++; }
    if (activeCount > 0) {
      filtered = filtered.filter(function(r) {
        return (r.platforms || []).some(function(p) { return activeFilters[p]; });
      });
    }
    document.getElementById("card-grid").innerHTML = renderCards(filtered);
  }

  async function doSearch() {
    const q = document.getElementById("search-input").value.trim();
    if (!q) return;
    document.getElementById("search-placeholder").classList.add("hidden");
    const grid = document.getElementById("search-results-grid");
    grid.innerHTML = '<div class="col-span-full text-center py-10 text-sub text-sm">搜索中...</div>';

    const rules = await api("/api/rules/list/search?q=" + encodeURIComponent(q)) || [];
    if (!rules.length) {
      grid.innerHTML = '<div class="col-span-full text-center py-10 text-sub text-sm">未找到结果</div>';
      return;
    }
    grid.innerHTML = renderCards(rules);
  }

  function renderCards(rules) {
    return rules.map(r => {
      const platforms = r.platforms || [];
      return `<div class="bg-[#2a2a2a] border border-[rgba(255,255,255,.08)] rounded-xl p-3 flex flex-col card-h hover:border-[rgba(255,255,255,.12)] transition-colors">
        <div class="text-sm font-semibold truncate"><span ${tipAttr((r.app_id || '') + (r.status && r.status.length && r.status[0] ? '<br>状态：' + r.status.join(', ') : ''))}>${r.name || r.app_id}</span>${(r.status && r.status.length && r.status[0]) ? ' <span class="inline-block w-2 h-2 rounded-full bg-[#e8a040] align-middle" title="' + r.status.join(', ') + '"></span>' : ''}</div>
        <div class="text-xs text-sub mt-1 truncate">${r.description || r.app_id}</div>
        <div class="flex-1 mt-3 flex flex-col gap-1 pl-2">
          ${platforms.map(p => `<label class="flex items-center gap-2 text-xs text-sub cursor-pointer"><input type="checkbox" class="rule-cb" data-os="${p}" onchange="event.stopPropagation()"> ${platformLabel(p)}</label>`).join("")}
        </div>
        <button onclick="event.stopPropagation(); addToTracker('${r.app_id}', this)" class="mt-3 w-full text-center text-xs text-sub hover:text-white border border-[rgba(255,255,255,.12)] rounded-lg py-1 cursor-pointer hover:border-[#14b8a6] transition-colors">添加到默认 Tracker</button>
      </div>`;
    }).join("");
  }

  async function addToTracker(appId, btn) {
    const cbs = btn.closest(".card-h").querySelectorAll(".rule-cb:checked");
    const platforms = Array.from(cbs).map(cb => cb.dataset.os);
    await apiPost("/api/tracker/add", { app_id: appId, platforms });
    btn.textContent = "✓";
    btn.classList.add("text-ok");
  }
</script>
</body>
</html>
