<!doctype html>
<html lang="zh-CN" class="bg-[#1d1d1d]">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serein</title>
<link rel="icon" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body class="text-[rgba(255,255,255,.88)] min-h-screen">
<div id="topbar"></div>

<div class="max-w-[1200px] mx-auto p-6 flex gap-6 min-h-[calc(100vh-48px)]">
  <aside class="w-[200px] shrink-0 pr-4 border-r border-[rgba(255,255,255,.08)]">
    <div class="text-sm text-sub font-semibold mb-2">Tracker</div>
    <nav id="tracker-nav" class="flex flex-col gap-0.5"></nav>
    <button id="btn-new-tracker" class="mt-3 w-full text-center text-xs text-sub hover:text-white border border-dashed border-[rgba(255,255,255,.15)] rounded-lg py-1.5 cursor-pointer hover:border-[#14b8a6] transition-colors">新建 Tracker</button>
  </aside>

  <main class="flex-1 min-w-0">
    <div id="placeholder" class="text-sub text-sm max-w-[600px] pt-[25vh] pl-2">
      <h2 class="text-lg font-semibold text-white mb-3">欢迎使用 Serein</h2>
      <p class="mb-2">在左侧栏选择一个 Tracker 来查看对应列表中追踪的软件。</p>
      <p class="mb-4">点击右上角的按钮，能够检查软件更新。</p>
      <p class="mb-8">若是你第一次启动，请前往<a href="/rules" class="text-[#14b8a6] hover:underline">规则页</a>，点击右上角的「同步规则」来拉取内置的规则表。</p>

      <h2 class="text-lg font-semibold text-white mb-3">关于</h2>
      <p class="mb-2">Serein 在 <a href="https://github.com/Vanadiry/Serein/" class="text-[#14b8a6] hover:underline">GitHub</a> 开源。前后端分离，你可以在 GitHub 项目中查看 API 文档。</p>
      <p>规则表也依赖于社区贡献，内置的规则表项目：<a href="https://github.com/Vanadiry/SereinRulesList/" class="text-[#14b8a6] hover:underline">SereinRulesList</a>。</p>

    </div>
    <div id="software-list" class="flex flex-col gap-0 hidden"></div>
  </main>
</div>

<script src="/assets/app.min.js"></script>
<script>
  var currentTracker = null;
  var checkResults = {};

  renderTopbar("应用");
  loadTrackers();

  document.getElementById("btn-tracker-check").onclick = () => checkTracker();
  document.getElementById("btn-check-all").onclick = () => checkAll();
  document.getElementById("btn-read-cache").onclick = () => readCache();
  document.getElementById("btn-new-tracker").onclick = () => {
    showModal(`
      <div class="text-sm font-semibold mb-4">新建 Tracker</div>
      <input id="new-tracker-name" class="w-full bg-[#202028] border border-[rgba(255,255,255,.12)] rounded-lg px-3 py-2 text-sm outline-none focus:border-[#14b8a6] mb-3" placeholder="Tracker 名称">
      <div class="flex justify-end gap-2">
        <button onclick="this.closest('.fixed').remove()" class="px-3 py-1 rounded-lg border border-[rgba(255,255,255,.12)] bg-transparent text-sub text-xs cursor-pointer hover:text-white">取消</button>
        <button id="btn-create-tracker" class="px-3 py-1 rounded-lg bg-[#14b8a6] text-white text-xs font-semibold cursor-pointer hover:opacity-90">创建</button>
      </div>`);
    document.getElementById("btn-create-tracker").onclick = async () => {
      const name = document.getElementById("new-tracker-name").value.trim();
      if (!name) return;
      await apiPost("/api/tracker/new", { id: name });
      document.querySelector(".fixed")?.remove();
      loadTrackers();
    };
  };

  async function loadTrackers() {
    const list = await api("/api/tracker/list/all") || [];
    const hasSerein = list.some(t => t.id === "_serein");
    if (!hasSerein) list.unshift({ id: "_serein", display_name: "_serein" });
    const nav = document.getElementById("tracker-nav");
    nav.innerHTML = list.map(t => {
      const active = t.id === currentTracker && currentTracker ? "text-white bg-[#202028] border-l-[2px] border-l-[#14b8a6]" : "text-sub hover:text-white border-l-[2px] border-l-transparent hover:bg-[#202028] hover:border-l-[rgba(255,255,255,.12)]";
      return `<button onclick="selectTracker('${t.id}')" class="text-left px-3 py-2 text-sm rounded-r-md transition-colors ${active}">${t.display_name || t.id}</button>`;
    }).join("");
  }

  async function selectTracker(id) {
    currentTracker = id;
    loadTrackers();
    document.getElementById("placeholder").classList.add("hidden");
    await loadTrackerDetail(id);
  }

  async function loadTrackerDetail(id) {
    const data = await api("/api/tracker/list/" + id) || [];
    const list = document.getElementById("software-list");
    const placeholder = document.getElementById("placeholder");
    if (!data.length) {
      placeholder.classList.remove("hidden");
      placeholder.innerHTML = '<h2 class="text-lg font-semibold text-white mb-2">空的 Tracker</h2><p>这个 Tracker 还没有添加任何软件。前往<a href="/rules" class="text-[#14b8a6] hover:underline">规则页面</a>搜索并添加软件。</p>';
      list.classList.add("hidden");
      return;
    }
    placeholder.classList.add("hidden");
    list.classList.remove("hidden");
    list.innerHTML = data.map(d => renderSoftwareRow(d)).join("");
  }

  function renderSoftwareRow(d) {
    const checked = checkResults[d.app_id];
    const hasUpdate = checked && Object.values(checked.platforms || {}).some(p => p.latest_version && p.latest_version !== p.current_version);
    let versionHTML = "";
    if (d.rule_missing) {
      versionHTML = `<span class="text-yellow-500 text-sm">⚠ 规则缺失</span>`;
    } else if (hasUpdate) {
      const parts = [];
      var sortedOS = Object.keys(checked.platforms).sort(function(a, b) { var order = ["macos","windows","linux","ios","android"]; return order.indexOf(a) - order.indexOf(b); });
      var groups = {};
      var groupOrder = [];
      for (var si = 0; si < sortedOS.length; si++) { var os = sortedOS[si]; var p = checked.platforms[os];
        var cur = p.current_version || "-";
        var lat = p.latest_version || "-";
        var key = cur + "|" + lat;
        if (!groups[key]) { groups[key] = { current: cur, latest: p.latest_version, oses: [] }; groupOrder.push(key); }
        groups[key].oses.push(os);
      }
      for (var gi = 0; gi < groupOrder.length; gi++) {
        var g = groups[groupOrder[gi]];
        var icons = '<span class="inline-flex gap-px">';
        for (var ii = 0; ii < g.oses.length; ii++) { icons += platformIcon(g.oses[ii], "w-4 h-4"); }
        icons += '</span>';
        if (g.latest && g.latest !== g.current) {
          parts.push(`<span class="opacity-50">${icons}</span> <span class="text-err">${g.current}</span> <span class="text-sub">→</span> <span class="text-ok">${g.latest}</span>`);
        } else if (g.latest && g.latest === g.current) {
          parts.push(`<span class="opacity-50">${icons}</span> <span class="text-ok">${g.current}</span> <span class="text-sub">(无更新)</span>`);
        } else {
          parts.push(`<span class="opacity-50">${icons}</span> <span class="text-sub">${g.current}</span>`);
        }
      }
      versionHTML = `<span class="text-sm text-sub inline-flex items-center gap-1">${parts.join(" &nbsp;&nbsp;")}</span>`;
    } else if (checked && Object.keys(checked.platforms || {}).length > 0) {
      const parts = [];
      var sortedOS = Object.keys(checked.platforms).sort(function(a, b) { var order = ["macos","windows","linux","ios","android"]; return order.indexOf(a) - order.indexOf(b); });
      var groups2 = {};
      var groupOrder2 = [];
      for (var si = 0; si < sortedOS.length; si++) { var os = sortedOS[si]; var p = checked.platforms[os];
        var v = p.current_version || p.latest_version || d.current_version?.[os] || "-";
        if (!groups2[v]) { groups2[v] = []; groupOrder2.push(v); }
        groups2[v].push(os);
      }
      for (var gi = 0; gi < groupOrder2.length; gi++) {
        var v2 = groupOrder2[gi];
        var icons = '<span class="inline-flex gap-px">';
        for (var ii = 0; ii < groups2[v2].length; ii++) { icons += platformIcon(groups2[v2][ii], "w-4 h-4"); }
        icons += '</span>';
        parts.push(`<span class="opacity-50">${icons}</span> <span class="text-ok">${v2}</span> <span class="text-sub">(无更新)</span>`);
      }
      versionHTML = `<span class="text-sm text-sub inline-flex items-center gap-1">${parts.join(" &nbsp;&nbsp;")}</span>`;
    } else {
      const parts = [];
      var sortedOS2 = Object.keys(d.current_version || {}).sort(function(a, b) { var order = ["macos","windows","linux","ios","android"]; return order.indexOf(a) - order.indexOf(b); });
      var groups3 = {};
      var groupOrder3 = [];
      for (var si2 = 0; si2 < sortedOS2.length; si2++) { var os = sortedOS2[si2]; var v = (d.current_version || {})[os] || "-";
        if (!groups3[v]) { groups3[v] = []; groupOrder3.push(v); }
        groups3[v].push(os);
      }
      for (var gi = 0; gi < groupOrder3.length; gi++) {
        var v3 = groupOrder3[gi];
        var icons = '<span class="inline-flex gap-px">';
        for (var ii = 0; ii < groups3[v3].length; ii++) { icons += platformIcon(groups3[v3][ii], "w-4 h-4"); }
        icons += '</span>';
        parts.push(`<span class="opacity-50">${icons}</span> ${v3}`);
      }
      versionHTML = `<span class="text-sm text-sub inline-flex items-center gap-1">${parts.join(" &nbsp;&nbsp;") || "未记录版本"}</span>`;
    }

    // 右侧：[平台]  |  [yes]  |  [编辑] [地球] [刷新]
    let rightIcons = `<span class="flex items-center gap-2 shrink-0">`;
    // 平台下载图标（检查后有数据才显示）
    if (checked && Object.keys(checked.platforms || {}).length > 0) {
      var dlOS = Object.keys(checked.platforms).sort(function(a, b) { var order = ["macos","windows","linux","ios","android"]; return order.indexOf(a) - order.indexOf(b); });
      for (var di = 0; di < dlOS.length; di++) { var os = dlOS[di]; var p = checked.platforms[os];
        if (p.url) {
          const urls = typeof p.url === "string" ? [p.url] : (p.url || []);
          urls.forEach((url) => {
            rightIcons += linkWithTooltip(url, platformIcon(os, "w-5 h-5"), os);
          });
        }
      }
      rightIcons += `<span onclick="event.stopPropagation(); confirmUpdate('${d.app_id}')" class="mx-3" ${tipAttr("确认这个更新")}>${iconYes("应用更新", "w-5 h-5")}</span>`;
    }
    // 常驻按钮：编辑、地球、刷新，粉色背景
    rightIcons += `<span onclick="event.stopPropagation(); editVersion('${d.app_id}')" ${tipAttr("修改已记录的版本号")}>${iconImg("edit", "修改已记录的版本号", "w-5 h-5")}</span>`;
    rightIcons += `<span class="${d.official_website ? "" : "opacity-30"}" ${d.official_website ? tipAttr(earthTooltip(d.official_website)) : ''}>${d.official_website ? '<a href="' + d.official_website + '" target="_blank" onclick="event.stopPropagation()" class="no-underline">' + iconImg("earth", "官网", "w-5 h-5") + '</a>' : iconImg("earth", "无官网", "w-5 h-5")}</span>`;
    rightIcons += `<span onclick="event.stopPropagation(); refreshApp('${d.app_id}')" ${tipAttr("检查更新")}>${iconImg("refresh", "检查更新", "w-5 h-5")}</span>`;
    rightIcons += `</span>`;

    return `<div class="flex items-center bg-[#2a2a2a] border border-[rgba(255,255,255,.08)] rounded-lg pl-2 pr-4 h-16 hover:border-[rgba(255,255,255,.12)] transition-colors mb-2 overflow-hidden">
      <div class="flex-1 min-w-0 pr-4 flex flex-col justify-center">
        <div class="text-base font-semibold truncate pl-1"><span ${tipAttr((d.app_id || '') + (d.description ? '<br>' + d.description : '') + (d.status && d.status.length && d.status[0] ? '<br>状态：' + d.status.join(', ') : ''))}>${d.name || d.app_id}</span>${(d.status && d.status.length && d.status[0]) ? ' <span class="inline-block w-2 h-2 rounded-full bg-[#e8a040] align-middle" title="' + d.status.join(', ') + '"></span>' : ''}</div>
        <div class="mt-0.5">${versionHTML}</div>
      </div>
      ${rightIcons}
    </div>`;
  }

  async function refreshApp(appId) {
    console.log("[check] ids:", appId);
    const ld = showLoading("加载中", "正在检查...");
    const data = await apiPost("/api/check/ids", [appId]);
    finishCheck(ld, data || []);
  }

  async function confirmUpdate(appId) {
    const cr = checkResults[appId];
    if (!cr) return;
    const body = { app_id: appId };
    for (const [os, p] of Object.entries(cr.platforms || {})) {
      if (p.latest_version) body[os] = p.latest_version;
    }
    console.log("[confirm]", appId, body);
    await apiPost("/api/check/confirm", body);
    delete checkResults[appId];
    loadTrackerDetail(currentTracker);
  }

  async function editVersion(appId) {
    showModal(`
      <div class="text-sm font-semibold mb-4">编辑版本 — ${appId}</div>
      <div id="edit-platforms" class="flex flex-col gap-2 mb-4"></div>
      <div class="flex justify-end gap-2">
        <button onclick="this.closest('.fixed').remove()" class="px-3 py-1 rounded-lg border border-[rgba(255,255,255,.12)] bg-transparent text-sub text-xs cursor-pointer hover:text-white">取消</button>
        <button id="btn-save-version" class="px-3 py-1 rounded-lg bg-[#14b8a6] text-white text-xs font-semibold cursor-pointer hover:opacity-90">保存</button>
      </div>`);
    const detail = await api("/api/tracker/list/" + currentTracker);
    const entry = (detail || []).find(e => e.app_id === appId);
    var platforms = (entry && entry.current_version) ? Object.keys(entry.current_version) : [];
    document.getElementById("edit-platforms").innerHTML = platforms.map(os => {
      const cur = (entry && entry.current_version && entry.current_version[os]) || "";
      return `<div class="flex items-center gap-2"><span class="text-xs text-sub w-16">${os}</span><input class="flex-1 bg-[#202028] border border-[rgba(255,255,255,.12)] rounded-lg px-3 py-1.5 text-sm outline-none focus:border-[#14b8a6]" value="${cur}" data-os="${os}"></div>`;
    }).join("");
    document.getElementById("btn-save-version").onclick = async () => {
      const body = { app_id: appId };
      document.querySelectorAll("#edit-platforms input").forEach(inp => { body[inp.dataset.os] = inp.value.trim(); });
      await apiPost("/api/check/confirm", body);
      document.querySelector(".fixed")?.remove();
      loadTrackerDetail(currentTracker);
    };
  }

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function cleanGitHubError(msg) {
    // 提取 JSON 中的 message 字段
    var m = msg.match(/"message"\s*:\s*"([^"]+)"/);
    if (m) msg = m[1];
    // 截断 GitHub 提示
    var idx = msg.indexOf("(But here's the good news");
    if (idx >= 0) msg = msg.substring(0, idx).trim();
    return msg;
  }

  function collectErrors(data) {
    var errs = [];
    if (!Array.isArray(data)) return errs;
    for (const r of data) {
      for (const [os, p] of Object.entries(r.platforms || {})) {
        if (p.error) {
          var msg = cleanGitHubError(p.error);
          msg = escapeHtml(msg);
          // HTTP 403：不展示 HTML 正文，检测人机验证
          if (/^HTTP 403/.test(msg)) {
            var challengePatterns = [
              'challenges.cloudflare.com', '_cf_chl_opt', 'cf_chl', 'turnstile',
              'captcha', 'recaptcha', 'hcaptcha',
              '/cdn-cgi/challenge-platform',
              'akamai', 'challenge-platform',
              'distil', 'perimeterx', 'datadome', 'imperva', 'incapsula', 'sucuri',
              'Just a moment', 'Checking your browser'
            ];
            var isChallenge = false;
            for (var ci = 0; ci < challengePatterns.length; ci++) {
              if (msg.indexOf(challengePatterns[ci]) !== -1) { isChallenge = true; break; }
            }
            if (isChallenge) {
              window._hasChallenge = true;
              msg = 'HTTP 403 (Challenge)';
            } else {
              msg = 'HTTP 403';
            }
          }
          errs.push('<span class="text-[#e8a040]">' + r.name + " " + os + "</span>: " + msg);
        }
      }
    }
    return errs;
  }

  function finishCheck(ld, data) {
    mergeCheckResults(data);
    loadTrackerDetail(currentTracker);
    var errs = collectErrors(data);
    showCheckDone(ld, errs);
  }

  async function checkTracker() {
    const ld = showLoading("加载中", "正在检查当前 Tracker...");
    try { console.log("[check] tracker:", currentTracker); var data = await apiPost("/api/check/tracker", { tracker_id: currentTracker }); finishCheck(ld, data); }
    catch(e) { ld.done(e.message || "请求失败", true); }
  }

  async function checkAll() {
    const ld = showLoading("加载中", "正在检查全部更新...");
    try { console.log("[check] all"); var data = await apiPost("/api/check/all"); finishCheck(ld, data); }
    catch(e) { ld.done(e.message || "请求失败", true); }
  }

  function showCheckDone(ld, errs) {
    if (!errs.length) { ld.done("检查完成"); return; }
    var hasRateLimit = errs.some(function(e) { return e.indexOf("API rate limit exceeded") >= 0; });
    var hasAbuse = errs.some(function(e) { return e.indexOf("abuse detection") >= 0; });
    var body = "";
    if (hasRateLimit) body += "提示：你似乎达到了 GitHub 请求速率限制，查看 Serein 文档获取更多信息。<br><br>";
    if (hasAbuse) body += "提示：你似乎在短时间大量请求 GitHub API 导致被暂时封禁。请降低并发，不要频繁操作，稍等片刻再继续尝试。<br><br>";
    var hasCloudflare = window._hasChallenge;
    if (hasCloudflare) body += "提示：似乎触发了人机验证，请尝试手动更新。<br><br>";
    window._hasChallenge = false;
    body += errs.join("<br>");
    ld.done(body, true, errs.length + " 个错误");
  }

  async function readCache() {
    const ld = showLoading("加载中", "正在读取缓存...");
    for (const t of ["all", "ids", "tracker"]) {
      mergeCheckResults(await api("/api/check/temp/" + t));
    }
    loadTrackerDetail(currentTracker);
    ld.done("读取完成");
  }

  function mergeCheckResults(data) {
    if (!Array.isArray(data)) return;
    for (const r of data) {
      if (!checkResults[r.app_id]) { checkResults[r.app_id] = r; continue; }
      for (const [os, p] of Object.entries(r.platforms || {})) {
        checkResults[r.app_id].platforms[os] = p;
      }
    }
  }

</script>
</body>
</html>
