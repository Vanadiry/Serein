[package]
name = "Serein"
version = "1.3.0"
description = "软件更新追踪器"
authors = ["Vanadiry"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["webview-data-url"] }
