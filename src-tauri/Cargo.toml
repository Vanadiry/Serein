[package]
name = "Serein"
version = "2.2.1"
description = "软件更新追踪器"
authors = ["Vanadiry"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["webview-data-url"] }
