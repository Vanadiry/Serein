openapi: "3.0.3"
info:
  title: Serein API
  version: "1.1.0"
servers:
  - url: http://127.0.0.1:12510
paths:
  # Tracker
  /api/tracker/list/all:
    get:
      tags: [Tracker]
      summary: 列出所有 tracker
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrackerInfo"
  /api/tracker/list/{id}:
    get:
      tags: [Tracker]
      summary: 列出 tracker 详情
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrackerDetail"
  /api/tracker/new:
    post:
      tags: [Tracker]
      summary: 新建 tracker
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
      responses:
        "201": { description: Created }
        "409": { description: Already exists }
  /api/tracker/add:
    post:
      tags: [Tracker]
      summary: 追加条目到 tracker
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [app_id]
              properties:
                tracker_id: { type: string, default: "_serein" }
                app_id: { type: string }
                platforms: { type: array, items: { type: string } }
      responses:
        "200": { description: OK }
  /api/tracker/apps:
    get:
      tags: [Tracker]
      summary: 获取所有已追踪的 app_id
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  # Check
  /api/check/all:
    post:
      tags: [Check]
      summary: 检查全部软件更新（异步，返回 task_id）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
  /api/check/ids:
    post:
      tags: [Check]
      summary: 检查指定软件（单个同步返回结果，批量异步返回 task_id）
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/CheckResponse"
                  - $ref: "#/components/schemas/TaskResponse"
  /api/check/tracker:
    post:
      tags: [Check]
      summary: 检查指定 tracker（异步，返回 task_id）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [tracker_id]
              properties:
                tracker_id: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
  /api/check/confirm:
    post:
      tags: [Check]
      summary: 确认更新，写入版本号
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [app_id]
              properties:
                app_id: { type: string }
              additionalProperties:
                type: string
              description: "其他 key 为平台名，value 为版本号，如 \"macos\": \"1.0.0\""
      responses:
        "200": { description: OK }
  /api/check/temp/{type}:
    get:
      tags: [Check]
      summary: 获取最新检查结果缓存
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [ids, all, tracker]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TempCheckResult"

  # Progress (SSE)
  /api/progress/{task_id}:
    get:
      tags: [Progress]
      summary: SSE 进度流
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  每行 `data: <json>\n\n`。
                  规则同步事件:
                    start:  {"step":"start","name":"","done":0,"total":<files>}
                    list:   {"step":"list","name":"<source_id>","done":0,"total":0}
                    source: {"step":"source","name":"<source_id>","files":<n>}
                    skip:   {"step":"skip","name":"<source_id>","files":<n>}
                    file:   {"step":"file","name":"<filename>","done":5,"total":131}
                    error:  {"step":"error","name":"<url> 获取失败","done":0,"total":0}
                    done:   {"step":"done","sources_total":10,"sources_skipped":3,"sources_updated":6,"files":45,"file_errors":0}
                  检查更新事件:
                    start: {"step":"start","name":"","done":0,"total":<n>}
                    app:   {"step":"app","name":"<app>","done":12,"total":30}
                    done:  {"step":"done"}
  /api/check/cancel/{task_id}:
    post:
      tags: [Progress]
      summary: 终止任务（退出后端进程）
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: "进程退出" }

  # Events (SSE)
  /api/events:
    get:
      tags: [Events]
      summary: 全局事件流（SSE），推送后端错误/警告到前端
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  data: {"level":"error","context":"[check]","message":"...","ts":1720000000}
                  data: {"level":"warn","context":"[checker]","message":"...","ts":1720000000}

  # Config
  /api/config:
    get:
      tags: [Config]
      summary: 获取当前配置和动态配置
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  config:
                    type: object
                    description: 键值对，包括监听地址、下载器、并发数、默认平台、规则源、动态配置源
                  profile:
                    type: object
                    properties:
                      known_extensions:
                        type: array
                        items: { type: string }

  # Sync
  /api/sync:
    post:
      tags: [Sync]
      summary: 拉取规则或动态配置
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [rules, profile]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TaskResponse"
                  - $ref: "#/components/schemas/ProfileSyncResponse"

  # Rules
  /api/rules:
    get:
      tags: [Rules]
      summary: 列出规则源或搜索/筛选规则
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: 搜索关键词，按名称匹配
        - name: source
          in: query
          schema: { type: string }
          description: 按 source_id 筛选
      responses:
        "200":
          description: |
            无参数时返回 SourceItem 数组；
            带 q 或 source 参数时返回 RuleItem 数组
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/SourceItem"
                  - type: array
                    items:
                      $ref: "#/components/schemas/RuleItem"

  # Download / Open
  /api/download:
    post:
      tags: [Download]
      summary: 发送到下载器
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  message: { type: string }
  /api/open-url:
    post:
      tags: [Download]
      summary: 在浏览器中打开 URL
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
      responses:
        "200": { description: OK }

components:
  schemas:
    TaskResponse:
      type: object
      properties:
        task_id: { type: string }
        total: { type: string }
    ProfileSyncResponse:
      type: object
      properties:
        updated: { type: boolean }
        known_extensions:
          type: array
          items: { type: string }
    TrackerInfo:
      type: object
      properties:
        id: { type: string }
        display_name: { type: string }
        order: { type: integer }
    TrackerDetail:
      type: object
      properties:
        app_id: { type: string }
        name: { type: string }
        description: { type: string }
        official_website: { type: string }
        source_id: { type: string }
        source_name: { type: string }
        current_version:
          type: object
          additionalProperties: { type: string }
        rule_missing: { type: boolean }
    CheckResponse:
      type: object
      properties:
        app_id: { type: string }
        name: { type: string }
        official_website: { type: string }
        platforms:
          type: object
          additionalProperties:
            type: object
            properties:
              current_version: { type: string }
              latest_version: { type: string }
              url:
                oneOf:
                  - type: string
                  - type: array
                    items: { type: string }
              error: { type: string }
    RuleItem:
      type: object
      properties:
        app_id: { type: string }
        name: { type: string }
        description: { type: string }
        official_website: { type: string }
        platforms:
          type: array
          items: { type: string }
        source_id: { type: string }
        source_name: { type: string }
    SourceItem:
      type: object
      properties:
        source_id: { type: string }
        name: { type: string }
        description: { type: string }
        app_count: { type: integer }
    TempCheckResult:
      type: object
      properties:
        app_id: { type: string }
        name: { type: string }
        platforms:
          type: object
          additionalProperties:
            type: object
            properties:
              current_version: { type: string }
              latest_version: { type: string }
              url:
                oneOf:
                  - type: string
                  - type: array
                    items: { type: string }
              error: { type: string }
