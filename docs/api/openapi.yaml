openapi: "3.0.3"
info:
  title: Serein API
  version: "2.1.0"
servers:
  - url: http://127.0.0.1:12510
paths:
  # Tracker
  /api/tracker/list/all:
    get:
      tags: [Tracker]
      summary: 列出所有 tracker
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrackerInfo"
  /api/tracker/list/{tracker_id}:
    get:
      tags: [Tracker]
      summary: 列出 tracker 详情
      parameters:
        - name: tracker_id
          in: path
          required: true
          description: Tracker 文件名，不含 .toml 后缀
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrackerDetail"
  /api/tracker/new:
    post:
      tags: [Tracker]
      summary: 新建 tracker
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string }
      responses:
        "201": { description: Created }
        "409": { description: Already exists }
  /api/tracker/add:
    post:
      tags: [Tracker]
      summary: 追加条目到默认 Tracker
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [app_id]
              properties:
                app_id: { type: string }
                platforms: { type: array, items: { type: string } }
      responses:
        "200": { description: OK }
  /api/tracker/apps:
    get:
      tags: [Tracker]
      summary: 获取所有已追踪的 app_id
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  # Check
  /api/check:
    post:
      tags: [Check]
      summary: 发起检查（异步，返回 task_id；进度见 /api/progress/{task_id}）
      description: |
        通过 `scope` 指定检查范围：
        - `all`：检查所有 Tracker
        - `trackers`：检查 `tracker_ids` 指定的 Tracker（按顺序串行）
        - `ids`：按 Tracker 分组检查给定 id，`ids` 为 `{ "<tracker>": ["id", ...] }`
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope:
                  type: string
                  enum: [all, trackers, ids]
                tracker_ids:
                  type: array
                  items: { type: string }
                  description: scope=trackers 时必填
                ids:
                  type: object
                  additionalProperties:
                    type: array
                    items: { type: string }
                  description: scope=ids 时必填；key 为 Tracker 名
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
  /api/check/confirm:
    post:
      tags: [Check]
      summary: 确认某个 app 的版本号，写入版本号与时间戳
      description: |
        一次只确认一个 app。请求体解码为 `map[string]string`：`app_id` 指出是哪个应用，
        其余键是「平台 → 版本号」。整段 load-modify-save 在写锁内完成，并发调用不会互相覆盖。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [app_id]
              additionalProperties: { type: string }
              properties:
                app_id: { type: string }
              example: { app_id: "pub.sakura.Zen", macos: "1.2.3" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  app_id: { type: string }
                  status: { type: string, example: ok }
                  platforms:
                    type: object
                    description: 确认后该 app 的全部平台版本号，另含服务端写入的 `_confirmed_at`（Unix 秒）
                    additionalProperties: { type: string }
                example:
                  app_id: "pub.sakura.Zen"
                  status: ok
                  platforms: { macos: "1.2.3", _confirmed_at: "1720000000" }
        "400": { description: "app_id 缺失或请求体不是 JSON 对象" }
        "500": { description: "写入 software.json 失败" }
  /api/check/temp/{tracker_id}:
    get:
      tags: [Check]
      summary: 获取指定 tracker 的最新检查结果缓存
      parameters:
        - name: tracker_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/CheckResponse"

  # Progress (SSE)
  /api/progress/{task_id}:
    get:
      tags: [Progress]
      summary: SSE 进度流
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  每行 `data: <json>\n\n`。每个任务有且仅有一条 `step:"done"`。

                  规则同步事件（顶层源之间串行，同一顶层源内先走树再下载）：
                    start:    {"step":"start","name":"","done":<已完成>,"total":<累计>}
                    list:     {"step":"list","name":"<source_id>","done":0,"total":0}
                    source:   {"step":"source","name":"<source_id>","files":<本轮需下载数>}
                    skip:     {"step":"skip","name":"<source_id>","files":<manifest 条目数>}
                    file:     {"step":"file","name":"<filename>","done":5,"total":131}
                    write:    {"step":"write","name":"正在写入 <n> 个源"}
                    error:    {"step":"error","name":"<url> 获取失败","done":0,"total":0}
                    done:     {"step":"done","sources_total":10,"sources_skipped":3,"sources_updated":5,"sources_failed":1,"files":45,"file_errors":1,"cancelled":false,"failures":[{"source":"v-github","file":"foo.toml","error":"HTTP 404: Not Found"}]}

                  同步计数口径：
                    - `files` 为**本轮实际需下载的文件数**，跳过的文件不计入；每个文件对应一次 `file` 事件。
                    - `done`/`total` 跨顶层源累计，单调递增；`start` 只在首次出现时发出（重复发会让进度条清零）。
                    - `sources_total` = 发现的叶子源数 + 抓取失败的子源数。抓取失败的子源同时计入 `sources_failed`，
                      否则 `sources_total` 与 `sources_failed` 双为 0，客户端会把失败判成成功。
                    - `skip` 按源汇总（不逐文件发），条件是 token 全部未变、无本地多余条目、且本地有可信 marker。
                    - `write` 表示下载已结束、正在原地落盘（含删除上游已不再列出的文件与孤儿子源）。

                  检查更新事件:
                    start: {"step":"start","name":"","done":0,"total":<n>}
                    app:   {"step":"app","name":"<app>","done":12,"total":30}   # 检查全部时为 "<Tracker>：<app>"
                    done:  {"step":"done","cancelled":false}

                  检查结果按 Tracker 缓存在内存（进程内），通过 GET /api/check/temp/{tracker_id} 读取。

        "404": { description: "任务不存在或已过期" }

  /api/check/cancel/{task_id}:
    post:
      tags: [Progress]
      summary: 终止任务（取消其 context，由任务自身收尾，不再结束进程）
      parameters:
        - name: task_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: "已取消" }
        "404": { description: "任务不存在" }

  # Events (SSE)
  /api/events:
    get:
      tags: [Events]
      summary: 全局事件流（SSE），推送后端错误/警告到前端
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  data: {"level":"error","context":"[check]","message":"...","ts":1720000000}
                  data: {"level":"warn","context":"[checker]","message":"...","ts":1720000000}

  # Config
  /api/config:
    get:
      tags: [Config]
      summary: 获取当前配置和动态配置
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  config:
                    type: object
                    description: 键值对，包括监听地址、下载器、并发数、默认平台、起始页、规则源、动态配置
                  profile:
                    type: object
                    properties:
                      known_extensions:
                        type: array
                        items: { type: string }
                      version_prefixes:
                        type: array
                        items: { type: string }
                      version_suffixes:
                        type: array
                        items: { type: string }
                  first_run:
                    type: boolean
                  rule_source_dev:
                    type: string
                    description: 本地规则目录路径；为空表示未启用，仅 POST /api/rules/check 的 dev 模式使用

  # Sync
  /api/sync:
    post:
      tags: [Sync]
      summary: 拉取规则或动态配置
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [rules, profile]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TaskResponse"
                  - $ref: "#/components/schemas/ProfileSyncResponse"

  # Rules
  /api/rules:
    get:
      tags: [Rules]
      summary: 列出规则源或搜索/筛选规则
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: 搜索关键词，按名称匹配
        - name: source
          in: query
          schema: { type: string }
          description: 按 source_id 筛选
      responses:
        "200":
          description: |
            无参数时返回 SourceItem 数组；
            带 q 或 source 参数时返回 RuleItem 数组
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/SourceItem"
                  - type: array
                    items:
                      $ref: "#/components/schemas/RuleItem"

  /api/search:
    get:
      tags: [Search]
      summary: 跨规则与所有 Tracker 搜索
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: 关键词，对名称 / app_id / 描述做不区分大小写的子串匹配；为空返回两个空数组
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  apps:
                    type: array
                    description: Tracker 命中项，匹配全部条目的 Tracker，合计最多 30 条
                    items: { $ref: "#/components/schemas/SearchAppHit" }
                  rules:
                    type: array
                    description: 规则命中项，按名称排序，不受 30 条上限限制
                    items: { $ref: "#/components/schemas/RuleItem" }

  # Rules
  /api/rules/check:
    post:
      tags: [Rules]
      summary: 校验全部规则，返回问题清单
      description: |
        会重新解析一遍 `rules/` 下的全部规则。`dev: true` 时改为校验 `config.serein.rule_source_dev`
        指向的本地目录，未配置该路径则返回 400。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dev:
                  type: boolean
                  description: 为 true 时校验 rule_source_dev 指向的本地规则目录
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  issues:
                    type: array
                    items: { $ref: "#/components/schemas/RuleIssue" }
        "400": { description: "dev 为 true 但未配置 rule_source_dev" }
        "500": { description: "校验 rule_source_dev 时出错" }

  # Download / Open
  /api/file:
    get:
      tags: [Download]
      summary: 带签名的下载代理（流式转发上游）
      description: |
        供检查结果里的 `proxy_url` 使用，让下载地址经本机中转。四个查询参数缺一不可，
        且 `sig` 必须与 (url, name, exp) 的 HMAC-SHA256 匹配，否则 403。

        签名密钥是进程级随机值，重启即全部失效；签名有效期 24 小时。
        上游地址还会经私网/非 http(s) 拦截。

        上游返回 4xx/5xx 时不会把错误页面当附件存下来：4xx 原样透传、5xx 转 502，
        并通过事件总线（`[下载]` 上下文）向 Serein 窗口推送一条提示。
      parameters:
        - name: url
          in: query
          required: true
          description: 上游完整地址
          schema: { type: string }
        - name: name
          in: query
          description: 落盘文件名；为空时回退上游 Content-Disposition 或 URL 末段
          schema: { type: string }
        - name: exp
          in: query
          required: true
          description: 过期时间，Unix 秒
          schema: { type: string }
        - name: sig
          in: query
          required: true
          description: "hex 编码的 HMAC-SHA256(secret, \"url\\nname\\nexp\")"
          schema: { type: string }
      responses:
        "200":
          description: "上游文件内容（Content-Disposition: attachment）"
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206": { description: 上游范围响应（透传 Range / If-Range） }
        "400": { description: "缺少 url，或 url 不是合法的 http(s) 地址" }
        "403": { description: "签名无效/过期，或目标地址被私网拦截" }
        "502": { description: "上游请求失败，或上游返回 5xx" }

  /api/download:
    post:
      tags: [Download]
      summary: 发送到下载器（根据 config 的 downloader 配置分发：browser / ndm / 自定义命令）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, description: 必须是 http(s) 绝对地址 }
      responses:
        "200":
          description: 已交给下载器；下载器未运行或配置未知时会回退到浏览器
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  message: { type: string }
        "400": { description: "缺少 url，或不是 http(s) 地址" }
        "403": { description: "仅本机可用（非回环地址调用）" }
  /api/open-url:
    post:
      tags: [Download]
      summary: 在浏览器中打开 URL
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, description: 必须是 http(s) 绝对地址 }
      responses:
        "200": { description: OK }
        "400": { description: "缺少 url，或不是 http(s) 地址" }
        "403": { description: "仅本机可用（非回环地址调用）" }

components:
  schemas:
    TaskResponse:
      type: object
      properties:
        task_id: { type: string }
        total: { type: string }
    ProfileSyncResponse:
      type: object
      properties:
        updated: { type: boolean }
        known_extensions:
          type: array
          items: { type: string }
    TrackerInfo:
      type: object
      properties:
        id: { type: string }
        display_name: { type: string }
        order: { type: integer }
        type: { type: string, description: "app（默认）| msvsix | openvsx" }
        count: { type: integer, description: 条目数 }
        updated: { type: integer, description: 有更新的条目数（仅 list/all） }
        checked: { type: boolean, description: 是否检查过（仅 list/all） }
    TrackerDetail:
      type: object
      properties:
        app_id: { type: string }
        name: { type: string }
        description: { type: string }
        official_website: { type: string }
        source_id: { type: string }
        source_name: { type: string }
        current_version:
          type: object
          additionalProperties: { type: string }
        confirmed_at: { type: string, description: "上次确认更新的 UTC 时间戳" }
        rule_missing: { type: boolean }
        status:
          $ref: "#/components/schemas/RuleStatus"
    CheckResponse:
      type: object
      properties:
        app_id: { type: string }
        name: { type: string }
        official_website: { type: string }
        platforms:
          type: object
          additionalProperties:
            type: object
            properties:
              current_version: { type: string }
              latest_version: { type: string }
              url:
                oneOf:
                  - type: string
                  - type: array
                    items: { type: string }
              error: { type: string }
              download_method: { type: string, enum: [browser, downloader] }
              download_via_proxy: { type: boolean }
              download_name: { type: string }
              proxy_url:
                oneOf:
                  - type: string
                  - type: array
                    items: { type: string }
    SearchAppHit:
      type: object
      properties:
        app_id: { type: string }
        name: { type: string }
        description: { type: string }
        tracker_id: { type: string }
        tracker_name: { type: string }
        current_version:
          type: object
          additionalProperties: { type: string }
          description: 用户已确认的版本号，来自 user/software.json
    RuleIssue:
      type: object
      properties:
        level:
          type: string
          enum: [warn, error]
        message: { type: string }
    RuleItem:
      type: object
      properties:
        app_id: { type: string }
        name: { type: string }
        description: { type: string }
        official_website: { type: string }
        platforms:
          type: array
          items: { type: string }
        source_id: { type: string }
        source_name: { type: string }
        status:
          $ref: "#/components/schemas/RuleStatus"
    RuleStatus:
      type: object
      description: 规则状态：消息 + 可选等级
      properties:
        message: { type: string }
        level: { type: string, description: "warn | error | removed（可省略）" }
    SourceItem:
      type: object
      properties:
        source_id: { type: string }
        name: { type: string }
        description: { type: string }
        app_count: { type: integer }
